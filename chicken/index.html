<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chicken</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🐔 chicken</h1>
    <div class="modes">
      <button class="mode active" data-mode="draw" title="Draw whatever you like">🎨 Draw</button>
      <button class="mode" data-mode="quest" aria-haspopup="true" aria-expanded="false"
              title="Puzzles to solve with your program">🥚 Puzzles</button>
    </div>
    <div class="actions">
      <button id="run" title="Ctrl+Enter">Run</button>
      <button id="stop">Stop</button>
      <button id="format" title="Ctrl+Shift+F">Tidy Up</button>
      <button id="clear" title="Reset chicken &amp; canvas (your code stays)">Reset</button>
    </div>
    <div id="quest-panel" class="popover" hidden>
      <div class="popover-label">pick a puzzle</div>
      <div id="quest-list" class="quest-list"></div>
      <div class="popover-hint">★ get there &middot; ★ all the eggs &middot; ★ few commands</div>
    </div>
  </header>
  <div class="examples">
    <span class="examples-label">try:</span>
    <button class="example" data-example="square">Square</button>
    <button class="example" data-example="star">Star</button>
    <button class="example" data-example="flower">Flower</button>
    <button class="example" data-example="rainbow">Rainbow</button>
    <button class="example" data-example="zoo">Zoo</button>
    <button id="animal-btn" class="example" aria-haspopup="true" aria-expanded="false"
            title="Choose your animal">🐾 Animal ▾</button>
    <button id="save-script" class="example" title="Ctrl+S">💾 Save</button>
    <button id="my-scripts" class="example" aria-haspopup="true" aria-expanded="false">📂 My Scripts ▾</button>

    <div id="animal-panel" class="popover" hidden>
      <div class="popover-label">who do you want to be?</div>
      <div id="animal-grid" class="animal-grid"></div>
      <div class="popover-hint">tip: you can also write <code>be unicorn</code> in your program</div>
    </div>

    <div id="save-popover" class="popover" hidden>
      <label class="popover-label" for="save-name">name your script:</label>
      <input id="save-name" type="text" maxlength="24" autocomplete="off" spellcheck="false">
      <div class="popover-actions">
        <button id="save-confirm" class="popover-primary">Save</button>
        <button id="save-cancel">Cancel</button>
      </div>
      <div id="save-hint" class="popover-hint" hidden></div>
    </div>

    <div id="scripts-panel" class="popover" hidden>
      <div id="scripts-list" class="scripts-list"></div>
    </div>

    <div id="dirty-confirm" class="popover" hidden>
      <div class="popover-message">Save your work first?</div>
      <div class="popover-actions">
        <button id="dirty-save" class="popover-primary">Save</button>
        <button id="dirty-throw" class="danger-btn">Throw away</button>
        <button id="dirty-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <main>
    <section class="editor">
      <div id="code-banner" class="code-banner" hidden></div>
      <div class="code-area">
        <!-- Highlight bands live behind the textarea, which is transparent.
             The textarea never wraps (white-space: pre), so line number maps
             straight to a row offset. -->
        <div id="code-marks" aria-hidden="true"></div>
        <textarea id="code" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
      <aside class="cheatsheet" id="cheatsheet"></aside>
    </section>
    <section class="coop">
      <canvas id="canvas" width="600" height="600"></canvas>
    </section>
  </main>
  <footer>
    <div id="status">ready</div>
  </footer>

  <script src="js/ops.js"></script>
  <script src="js/cluck.js"></script>
  <!-- levels + quest before coop: the renderer reads Levels at play time -->
  <script src="js/levels.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/coop.js"></script>
  <script src="js/saves.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
